<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>截图识别</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
        background: #f6f8fa;
        color: #1f2328;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* ── 主窗口（识别/翻译/截图入口） ── */
      body.main-ui .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }
      body.main-ui .header img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
      body.main-ui .header .title {
        font-size: 15px;
        font-weight: 600;
      }
      body.main-ui .header .badge {
        font-size: 11px;
        color: #15803d;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 20px;
        padding: 2px 8px;
      }
      body.main-ui .header .badge.translate {
        color: #7c3aed;
        background: #f5f3ff;
        border-color: #ddd6fe;
      }
      body.main-ui .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 16px;
      }
      body.main-ui .status {
        padding: 0 16px 8px;
        font-size: 12px;
        color: #6b7280;
      }
      body.main-ui .result-wrap {
        flex: 1;
        padding: 0 16px 16px;
        display: flex;
        flex-direction: column;
      }
      body.main-ui textarea {
        flex: 1;
        width: 100%;
        min-height: 220px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        line-height: 1.7;
        resize: none;
        background: #fff;
        font-family: inherit;
      }
      body.main-ui textarea:focus {
        outline: 2px solid #93c5fd;
        border-color: #3b82f6;
      }
      body.main-ui .tip {
        font-size: 12px;
        color: #9ca3af;
        padding: 0 16px 14px;
        line-height: 1.7;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d1d5db;
        background: #fff;
        color: #1f2328;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .btn:hover {
        background: #f3f4f6;
      }
      .btn.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .btn.primary:hover {
        background: #1d4ed8;
      }
      .btn.green {
        background: #059669;
        border-color: #059669;
        color: #fff;
      }
      .btn.green:hover {
        background: #047857;
      }
      .btn.purple {
        background: #7c3aed;
        border-color: #7c3aed;
        color: #fff;
      }
      .btn.purple:hover {
        background: #6d28d9;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      /* ── 贴屏悬浮窗（独立置顶窗口 · 纯图片 · 可拖动） ── */
      body.float-ui {
        background: #0f172a;
        min-height: 100vh;
        overflow: hidden;
        -webkit-app-region: drag;
        user-select: none;
        cursor: move;
      }
      .float-wrap {
        height: 100vh;
        padding: 4px;
      }
      .float-preview {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #1e293b;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .float-preview img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <!-- 主窗口 UI：识别 / 识别并翻译 -->
    <div class="header">
      <img src="icon.png" alt="MT" />
      <span class="title" id="title">截图识别</span>
      <span class="badge" id="badge">本地离线 · PaddleOCR</span>
    </div>
    <div class="actions">
      <button id="captureBtn" class="btn primary">框选截图识别</button>
      <button id="copyBtn" class="btn">复制结果</button>
      <button id="clearBtn" class="btn">清空</button>
    </div>
    <div class="status" id="status">点击"框选截图识别"选择屏幕区域</div>
    <div class="result-wrap">
      <textarea id="result" placeholder="识别结果将显示在这里"></textarea>
    </div>
    <div class="tip">识别在本地完成，图片不会上传到任何服务器。支持中文、英文与常用符号。</div>

    <!-- 贴屏悬浮窗 UI：独立置顶窗口专用（纯图片，可拖动，Esc 关闭） -->
    <div class="float-wrap" id="floatWrap" style="display: none">
      <div class="float-preview"><img id="floatImg" alt="截图预览" /></div>
    </div>

    <script>
      ;(function () {
        var isFloatWin = new URLSearchParams(window.location.search).get('way') === 'screen-float'

        if (isFloatWin) {
          // ─────────── 贴屏悬浮窗逻辑（纯图片 · 可拖动 · Esc 关闭） ───────────
          document.body.classList.add('float-ui')
          document.getElementById('floatWrap').style.display = 'block'
          var imgEl = document.getElementById('floatImg')
          var myToken = new URLSearchParams(window.location.search).get('token') || ''
          var currentImage = localStorage.getItem('mtScreenFloatImage') || ''
          var closed = false

          function closeSelf() {
            if (closed) return
            closed = true
            try {
              localStorage.removeItem('mtScreenFloatImage')
            } catch (e) {}
            try {
              window.close()
            } catch (e) {
              window.location.href = 'about:blank'
            }
          }

          if (currentImage) {
            imgEl.src = currentImage
          }

          // Esc 关闭悬浮窗
          document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeSelf()
          })

          // 被新截图替换（主窗口每次创建新悬浮窗前递增 token）时自动关闭旧窗
          var pollTimer = setInterval(function () {
            try {
              var cur = localStorage.getItem('mtScreenFloatToken') || ''
              if (cur && myToken && cur !== myToken) closeSelf()
            } catch (e) {}
            if (closed) clearInterval(pollTimer)
          }, 600)

          window.addEventListener('beforeunload', function () {
            clearInterval(pollTimer)
          })
          return
        }

        // ─────────── 主窗口逻辑（识别 / 识别并翻译 / 截图悬浮入口） ───────────
        document.body.classList.add('main-ui')
        var captureBtn = document.getElementById('captureBtn')
        var copyBtn = document.getElementById('copyBtn')
        var clearBtn = document.getElementById('clearBtn')
        var result = document.getElementById('result')
        var status = document.getElementById('status')
        var titleEl = document.getElementById('title')
        var badgeEl = document.getElementById('badge')

        // 当前模式：recognize=仅识别 / translate=识别并翻译 / float=截图悬浮（贴屏窗口）
        var mode = 'recognize'

        function setBusy(busy, msg) {
          captureBtn.disabled = busy
          if (msg) status.textContent = msg
        }

        function applyMode(m) {
          mode = m
          if (m === 'translate') {
            titleEl.textContent = '截图识别并翻译'
            badgeEl.textContent = '本地识别 · 自动翻译'
            badgeEl.classList.add('translate')
          } else if (m === 'float') {
            titleEl.textContent = '截图悬浮'
            badgeEl.textContent = '纯图片 · 可拖动 · Esc 关闭'
            badgeEl.classList.remove('translate')
          } else {
            titleEl.textContent = '截图识别'
            badgeEl.textContent = '本地离线 · PaddleOCR'
            badgeEl.classList.remove('translate')
          }
        }

        // 识别完成后：翻译模式自动跳转聚合翻译
        function maybeTranslate(text) {
          if (mode !== 'translate' || !text) return
          status.textContent = '已识别，正在跳转到聚合翻译…'
          try {
            var ok = window.ztools.redirect(['聚合翻译', '翻译'], text)
            if (ok !== false) {
              status.textContent = '已跳转到聚合翻译'
            } else {
              status.textContent = '跳转翻译失败，请确认已安装「聚合翻译」插件'
            }
          } catch (e) {
            console.error('[ScreenOcr] 跳转翻译失败:', e)
            status.textContent = '跳转翻译失败'
          }
        }

        // 创建贴屏置顶悬浮窗（默认右下角，可拖动到任意位置）
        function showFloatWindow(dataURL) {
          var img = new Image()
          img.onload = function () {
            var natW = img.naturalWidth || img.width || 400
            var natH = img.naturalHeight || img.height || 300
            var maxW = 520
            var maxH = Math.max(220, window.screen.availHeight - 80)
            var scale = Math.min(1, maxW / natW, maxH / natH)
            var w = Math.max(200, Math.round(natW * scale))
            var h = Math.max(120, Math.round(natH * scale))
            var s = window.screen
            var x = Math.max(s.availLeft || 0, (s.availLeft || 0) + (s.availWidth || 0) - w - 20)
            var y = Math.max(s.availTop || 0, (s.availTop || 0) + (s.availHeight || 0) - h - 20)

            localStorage.setItem('mtScreenFloatImage', dataURL)
            // token 递增：旧悬浮窗检测到变化后自动关闭，避免窗口堆积
            var token = String(Date.now())
            localStorage.setItem('mtScreenFloatToken', token)

            try {
              var win = window.ztools.createBrowserWindow(
                'index.html?way=screen-float&token=' + encodeURIComponent(token),
                {
                  width: w,
                  height: h,
                  x: x,
                  y: y,
                  frame: false,
                  resizable: false,
                  movable: true,
                  alwaysOnTop: true,
                  skipTaskbar: true,
                  show: false,
                  backgroundColor: '#0f172a'
                }
              )
              if (win) {
                if (win.setAlwaysOnTop) win.setAlwaysOnTop(true)
                if (win.show) win.show()
                if (win.moveTop) win.moveTop()
              }
              status.textContent = '已创建贴屏悬浮窗（可拖动，Esc 关闭）'
              // 隐藏主插件视图，只保留贴屏悬浮窗（不杀进程，下次触发命令自动恢复）
              if (typeof window.ztools.outPlugin === 'function') {
                try {
                  window.ztools.outPlugin(false)
                } catch (e) {
                  console.warn('[ScreenOcr] 隐藏主视图失败:', e)
                }
              }
            } catch (e) {
              console.error('[ScreenOcr] 创建悬浮窗失败:', e)
              status.textContent = '创建悬浮窗失败: ' + (e && e.message ? e.message : '未知错误')
            }
          }
          img.src = dataURL
        }

        async function doCapture() {
          setBusy(true, '正在框选屏幕区域…')
          var image = ''
          try {
            image = await new Promise(function (resolve) {
              if (typeof window.ztools.screenCapture === 'function') {
                window.ztools.screenCapture(function (img) {
                  resolve(img)
                })
              } else {
                resolve('')
              }
            })
          } catch (e) {
            console.error('[ScreenOcr] 截图失败:', e)
            image = ''
          }
          if (!image) {
            setBusy(false, '已取消截图，或当前环境不支持截图')
            return
          }

          if (mode === 'float') {
            // 截图悬浮：创建贴屏置顶悬浮窗
            showFloatWindow(image)
            setBusy(false)
            return
          }

          // 识别 / 识别并翻译：直接进入识别
          setBusy(true, '正在识别文字…')
          status.textContent = '正在识别文字…'
          try {
            var res = await window.ztools.ocrRecognize(image)
            if (res && res.success) {
              result.value = res.text || ''
              if (res.text) {
                status.textContent = '识别完成'
                maybeTranslate(res.text)
              } else {
                status.textContent = '未在所选区域识别到文字'
              }
            } else {
              status.textContent = '识别失败: ' + (res && res.error ? res.error : '未知错误')
            }
          } catch (e) {
            console.error('[ScreenOcr] 识别调用失败:', e)
            status.textContent = '识别调用失败: ' + (e && e.message ? e.message : '未知错误')
          }
          setBusy(false)
        }

        captureBtn.addEventListener('click', doCapture)

        copyBtn.addEventListener('click', function () {
          if (!result.value) return
          if (typeof window.utools.copyText === 'function') {
            window.utools.copyText(result.value)
          } else if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(result.value).catch(function () {})
          }
          status.textContent = '已复制到剪贴板'
        })

        clearBtn.addEventListener('click', function () {
          result.value = ''
          status.textContent = '点击"框选截图识别"选择屏幕区域'
        })

        // 识别进入的命令：每次进入都直接触发截图
        if (typeof window.utools.onPluginEnter === 'function') {
          window.utools.onPluginEnter(function (info) {
            var code = info && info.code ? info.code : 'screen-ocr'
            if (code === 'screen-ocr-translate') {
              applyMode('translate')
              status.textContent = '截图识别后将自动跳转到聚合翻译'
            } else if (code === 'screen-ocr-float') {
              applyMode('float')
              status.textContent = '正在截图，稍后显示贴屏悬浮窗…'
            } else {
              applyMode('recognize')
              status.textContent = '正在截图…'
            }
            // 每次进入都直接开始框选截图
            setTimeout(doCapture, 60)
          })
        } else {
          // 无 onPluginEnter 兼容层时，页面加载后自动开始一次
          setTimeout(doCapture, 300)
        }
      })()
    </script>
  </body>
</html>
