<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>截图识别</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
        background: #f6f8fa;
        color: #1f2328;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      body .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }
      body .header img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
      body .header .title {
        font-size: 15px;
        font-weight: 600;
      }
      body .header .badge {
        font-size: 11px;
        color: #15803d;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 20px;
        padding: 2px 8px;
      }
      body .header .badge.translate {
        color: #7c3aed;
        background: #f5f3ff;
        border-color: #ddd6fe;
      }
      body .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 16px;
      }
      body .status {
        padding: 0 16px 8px;
        font-size: 12px;
        color: #6b7280;
      }
      body .result-wrap {
        flex: 1;
        padding: 0 16px 16px;
        display: flex;
        flex-direction: column;
      }
      body textarea {
        flex: 1;
        width: 100%;
        min-height: 220px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        line-height: 1.7;
        resize: none;
        background: #fff;
        font-family: inherit;
      }
      body textarea:focus {
        outline: 2px solid #93c5fd;
        border-color: #3b82f6;
      }
      body .tip {
        font-size: 12px;
        color: #9ca3af;
        padding: 0 16px 14px;
        line-height: 1.7;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d1d5db;
        background: #fff;
        color: #1f2328;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .btn:hover {
        background: #f3f4f6;
      }
      .btn.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .btn.primary:hover {
        background: #1d4ed8;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <!-- 主窗口 UI：识别 / 识别并翻译 -->
    <div class="header">
      <img src="icon.png" alt="MT" />
      <span class="title" id="title">截图识别</span>
      <span class="badge" id="badge">本地离线 · PaddleOCR</span>
    </div>
    <div class="actions">
      <button id="captureBtn" class="btn primary">框选截图识别</button>
      <button id="copyBtn" class="btn">复制结果</button>
      <button id="clearBtn" class="btn">清空</button>
    </div>
    <div class="status" id="status">点击"框选截图识别"选择屏幕区域</div>
    <div class="result-wrap">
      <textarea id="result" placeholder="识别结果将显示在这里"></textarea>
    </div>
    <div class="tip">识别在本地完成，图片不会上传到任何服务器。支持中文、英文与常用符号。</div>

    <script>
      ;(function () {
        var captureBtn = document.getElementById('captureBtn')
        var copyBtn = document.getElementById('copyBtn')
        var clearBtn = document.getElementById('clearBtn')
        var result = document.getElementById('result')
        var status = document.getElementById('status')
        var titleEl = document.getElementById('title')
        var badgeEl = document.getElementById('badge')

        // 当前模式：recognize=仅识别 / translate=识别并翻译
        var mode = 'recognize'

        function setBusy(busy, msg) {
          captureBtn.disabled = busy
          if (msg) status.textContent = msg
        }

        function applyMode(m) {
          mode = m
          if (m === 'translate') {
            titleEl.textContent = '截图识别并翻译'
            badgeEl.textContent = '本地识别 · 自动翻译'
            badgeEl.classList.add('translate')
          } else {
            titleEl.textContent = '截图识别'
            badgeEl.textContent = '本地离线 · PaddleOCR'
            badgeEl.classList.remove('translate')
          }
        }

        // 识别完成后：翻译模式自动跳转聚合翻译
        function maybeTranslate(text) {
          if (mode !== 'translate' || !text) return
          status.textContent = '已识别，正在跳转到聚合翻译…'
          try {
            var ok = window.ztools.redirect(['聚合翻译', '翻译'], text)
            if (ok !== false) {
              status.textContent = '已跳转到聚合翻译'
            } else {
              status.textContent = '跳转翻译失败，请确认已安装「聚合翻译」插件'
            }
          } catch (e) {
            console.error('[ScreenOcr] 跳转翻译失败:', e)
            status.textContent = '跳转翻译失败'
          }
        }

        async function doCapture() {
          setBusy(true, '正在框选屏幕区域…')
          var image = ''
          try {
            image = await new Promise(function (resolve) {
              if (typeof window.ztools.screenCapture === 'function') {
                window.ztools.screenCapture(function (img) {
                  resolve(img)
                })
              } else {
                resolve('')
              }
            })
          } catch (e) {
            console.error('[ScreenOcr] 截图失败:', e)
            image = ''
          }
          if (!image) {
            setBusy(false, '已取消截图，或当前环境不支持截图')
            return
          }

          // 识别 / 识别并翻译：直接进入识别
          setBusy(true, '正在识别文字…')
          status.textContent = '正在识别文字…'
          try {
            var res = await window.ztools.ocrRecognize(image)
            if (res && res.success) {
              result.value = res.text || ''
              if (res.text) {
                status.textContent = '识别完成'
                maybeTranslate(res.text)
              } else {
                status.textContent = '未在所选区域识别到文字'
              }
            } else {
              status.textContent = '识别失败: ' + (res && res.error ? res.error : '未知错误')
            }
          } catch (e) {
            console.error('[ScreenOcr] 识别调用失败:', e)
            status.textContent = '识别调用失败: ' + (e && e.message ? e.message : '未知错误')
          }
          setBusy(false)
        }

        captureBtn.addEventListener('click', doCapture)

        copyBtn.addEventListener('click', function () {
          if (!result.value) return
          if (typeof window.utools.copyText === 'function') {
            window.utools.copyText(result.value)
          } else if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(result.value).catch(function () {})
          }
          status.textContent = '已复制到剪贴板'
        })

        clearBtn.addEventListener('click', function () {
          result.value = ''
          status.textContent = '点击"框选截图识别"选择屏幕区域'
        })

        // 识别进入的命令：每次进入都直接触发截图
        if (typeof window.utools.onPluginEnter === 'function') {
          window.utools.onPluginEnter(function (info) {
            var code = info && info.code ? info.code : 'screen-ocr'
            if (code === 'screen-ocr-translate') {
              applyMode('translate')
              status.textContent = '截图识别后将自动跳转到聚合翻译'
            } else {
              applyMode('recognize')
              status.textContent = '正在截图…'
            }
            // 每次进入都直接开始框选截图
            setTimeout(doCapture, 60)
          })
        } else {
          // 无 onPluginEnter 兼容层时，页面加载后自动开始一次
          setTimeout(doCapture, 300)
        }
      })()
    </script>
  </body>
</html>
