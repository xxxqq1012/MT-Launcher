<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>截图识别</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
        background: #f6f8fa;
        color: #1f2328;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }
      .header img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
      .header .title {
        font-size: 15px;
        font-weight: 600;
      }
      .header .badge {
        font-size: 11px;
        color: #15803d;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 20px;
        padding: 2px 8px;
      }
      .header .badge.translate {
        color: #7c3aed;
        background: #f5f3ff;
        border-color: #ddd6fe;
      }
      .header .badge.float {
        color: #b45309;
        background: #fffbeb;
        border-color: #fde68a;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 16px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d1d5db;
        background: #fff;
        color: #1f2328;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .btn:hover {
        background: #f3f4f6;
      }
      .btn.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .btn.primary:hover {
        background: #1d4ed8;
      }
      .btn.green {
        background: #059669;
        border-color: #059669;
        color: #fff;
      }
      .btn.green:hover {
        background: #047857;
      }
      .btn.purple {
        background: #7c3aed;
        border-color: #7c3aed;
        color: #fff;
      }
      .btn.purple:hover {
        background: #6d28d9;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .btn:disabled:hover {
        background: #fff;
      }
      .btn.primary:disabled:hover {
        background: #2563eb;
      }
      .status {
        padding: 0 16px 8px;
        font-size: 12px;
        color: #6b7280;
      }
      .result-wrap {
        flex: 1;
        padding: 0 16px 16px;
        display: flex;
        flex-direction: column;
      }
      textarea {
        flex: 1;
        width: 100%;
        min-height: 220px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        line-height: 1.7;
        resize: none;
        background: #fff;
        font-family: inherit;
      }
      textarea:focus {
        outline: 2px solid #93c5fd;
        border-color: #3b82f6;
      }
      .preview-wrap {
        flex: 1;
        padding: 0 16px 12px;
        display: none;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
      }
      .preview-wrap.show {
        display: flex;
      }
      .preview-box {
        flex: 1;
        min-height: 0;
        overflow: auto;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .preview-box img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .preview-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .empty {
        color: #9ca3af;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 13px;
      }
      .tip {
        font-size: 12px;
        color: #9ca3af;
        padding: 0 16px 14px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icon.png" alt="MT" />
      <span class="title" id="title">截图识别</span>
      <span class="badge" id="badge">本地离线 · PaddleOCR</span>
    </div>
    <div class="actions" id="normalActions">
      <button id="captureBtn" class="btn primary">框选截图识别</button>
      <button id="copyBtn" class="btn">复制结果</button>
      <button id="clearBtn" class="btn">清空</button>
    </div>
    <div class="actions" id="floatActions" style="display: none">
      <button id="floatCaptureBtn" class="btn primary">重新截图</button>
      <button id="floatRecognizeBtn" class="btn green">识别文字</button>
      <button id="floatTranslateBtn" class="btn purple">识别并翻译</button>
      <button id="floatCopyBtn" class="btn">复制图片</button>
      <button id="floatCloseBtn" class="btn">关闭</button>
    </div>
    <div class="status" id="status">点击"框选截图识别"选择屏幕区域</div>
    <div class="preview-wrap" id="previewWrap">
      <div class="preview-box"><img id="previewImg" alt="截图预览" /></div>
    </div>
    <div class="result-wrap" id="resultWrap">
      <textarea id="result" placeholder="识别结果将显示在这里"></textarea>
    </div>
    <div class="tip">识别在本地完成，图片不会上传到任何服务器。支持中文、英文与常用符号。</div>

    <script>
      ;(function () {
        const captureBtn = document.getElementById('captureBtn')
        const copyBtn = document.getElementById('copyBtn')
        const clearBtn = document.getElementById('clearBtn')
        const result = document.getElementById('result')
        const status = document.getElementById('status')
        const titleEl = document.getElementById('title')
        const badgeEl = document.getElementById('badge')
        const normalActions = document.getElementById('normalActions')
        const floatActions = document.getElementById('floatActions')
        const previewWrap = document.getElementById('previewWrap')
        const previewImg = document.getElementById('previewImg')
        const resultWrap = document.getElementById('resultWrap')

        // 当前模式：recognize=仅识别 / translate=识别并翻译 / float=截图悬浮
        let mode = 'recognize'
        let lastImage = ''

        function setBusy(busy, msg) {
          captureBtn.disabled = busy
          if (msg) status.textContent = msg
        }

        function applyMode(m) {
          mode = m
          if (m === 'translate') {
            titleEl.textContent = '截图识别并翻译'
            badgeEl.textContent = '本地识别 · 自动翻译'
            badgeEl.classList.add('translate')
            badgeEl.classList.remove('float')
          } else if (m === 'float') {
            titleEl.textContent = '截图悬浮'
            badgeEl.textContent = '截图后悬浮 · 可识别/翻译'
            badgeEl.classList.add('float')
            badgeEl.classList.remove('translate')
          } else {
            titleEl.textContent = '截图识别'
            badgeEl.textContent = '本地离线 · PaddleOCR'
            badgeEl.classList.remove('translate', 'float')
          }
        }

        function enterFloatLayout() {
          normalActions.style.display = 'none'
          floatActions.style.display = 'flex'
          previewWrap.classList.add('show')
          resultWrap.style.display = 'none'
        }

        function exitFloatLayout() {
          normalActions.style.display = 'flex'
          floatActions.style.display = 'none'
          previewWrap.classList.remove('show')
          resultWrap.style.display = 'flex'
        }

        // 识别完成后：翻译模式自动跳转聚合翻译
        function maybeTranslate(text) {
          if (mode !== 'translate' || !text) return
          status.textContent = '已识别，正在跳转到聚合翻译…'
          try {
            const ok = window.ztools.redirect(['聚合翻译', '翻译'], text)
            if (ok !== false) {
              status.textContent = '已跳转到聚合翻译'
            } else {
              status.textContent = '跳转翻译失败，请确认已安装「聚合翻译」插件'
            }
          } catch (e) {
            console.error('[ScreenOcr] 跳转翻译失败:', e)
            status.textContent = '跳转翻译失败: ' + (e && e.message ? e.message : '未知错误')
          }
        }

        async function doCapture() {
          setBusy(true, '正在框选屏幕区域…')
          let image = ''
          try {
            image = await new Promise(function (resolve) {
              if (typeof window.ztools?.screenCapture === 'function') {
                window.ztools.screenCapture(function (img) {
                  resolve(img)
                })
              } else {
                resolve('')
              }
            })
          } catch (e) {
            console.error('[ScreenOcr] 截图失败:', e)
            image = ''
          }
          if (!image) {
            setBusy(false, '已取消截图，或当前环境不支持截图')
            return
          }
          lastImage = image

          if (mode === 'float') {
            // 截图悬浮：展示图片预览，由用户决定后续动作
            previewImg.src = image
            enterFloatLayout()
            status.textContent = '已截图悬浮，选择操作：识别文字 / 识别并翻译 / 复制图片'
            return
          }

          // 识别 / 识别并翻译：直接进入识别
          setBusy(true, '正在识别文字…')
          status.textContent = '正在识别文字…'
          try {
            const res = await window.ztools.ocrRecognize(image)
            if (res && res.success) {
              result.value = res.text || ''
              if (res.text) {
                status.textContent = '识别完成'
                maybeTranslate(res.text)
              } else {
                status.textContent = '未在所选区域识别到文字'
              }
            } else {
              status.textContent = '识别失败: ' + (res?.error || '未知错误')
            }
          } catch (e) {
            console.error('[ScreenOcr] 识别调用失败:', e)
            status.textContent = '识别调用失败: ' + (e && e.message ? e.message : '未知错误')
          }
          setBusy(false)
        }

        // 悬浮模式：识别当前截图
        async function floatRecognize() {
          if (!lastImage) return
          status.textContent = '正在识别文字…'
          try {
            const res = await window.ztools.ocrRecognize(lastImage)
            if (res && res.success) {
              result.value = res.text || ''
              exitFloatLayout()
              status.textContent = res.text ? '识别完成' : '未识别到文字'
            } else {
              status.textContent = '识别失败: ' + (res?.error || '未知错误')
            }
          } catch (e) {
            console.error('[ScreenOcr] 识别调用失败:', e)
            status.textContent = '识别调用失败: ' + (e && e.message ? e.message : '未知错误')
          }
        }

        // 悬浮模式：识别并翻译
        async function floatRecognizeTranslate() {
          if (!lastImage) return
          status.textContent = '正在识别文字…'
          try {
            const res = await window.ztools.ocrRecognize(lastImage)
            if (res && res.success && res.text) {
              result.value = res.text
              exitFloatLayout()
              maybeTranslate(res.text)
            } else {
              status.textContent =
                res && res.success ? '未识别到文字' : '识别失败: ' + (res?.error || '未知错误')
            }
          } catch (e) {
            console.error('[ScreenOcr] 识别调用失败:', e)
            status.textContent = '识别调用失败: ' + (e && e.message ? e.message : '未知错误')
          }
        }

        // 悬浮模式：复制图片
        function floatCopy() {
          if (!lastImage) return
          if (typeof window.utools?.copyImage === 'function') {
            window.utools.copyImage(lastImage)
            status.textContent = '已复制图片到剪贴板'
          } else if (navigator.clipboard && navigator.clipboard.write) {
            const img = new Image()
            img.onload = function () {
              const canvas = document.createElement('canvas')
              canvas.width = img.width
              canvas.height = img.height
              canvas.getContext('2d').drawImage(img, 0, 0)
              canvas.toBlob(function (blob) {
                navigator.clipboard
                  .write([new ClipboardItem({ 'image/png': blob })])
                  .then(function () {
                    status.textContent = '已复制图片到剪贴板'
                  })
                  .catch(function () {
                    status.textContent = '复制图片失败'
                  })
              }, 'image/png')
            }
            img.src = lastImage
          }
        }

        function floatClose() {
          lastImage = ''
          previewImg.src = ''
          exitFloatLayout()
          status.textContent = '已关闭悬浮截图'
        }

        // 悬浮模式按钮
        document.getElementById('floatCaptureBtn').addEventListener('click', doCapture)
        document.getElementById('floatRecognizeBtn').addEventListener('click', floatRecognize)
        document
          .getElementById('floatTranslateBtn')
          .addEventListener('click', floatRecognizeTranslate)
        document.getElementById('floatCopyBtn').addEventListener('click', floatCopy)
        document.getElementById('floatCloseBtn').addEventListener('click', floatClose)

        captureBtn.addEventListener('click', doCapture)

        copyBtn.addEventListener('click', function () {
          if (!result.value) return
          if (typeof window.utools?.copyText === 'function') {
            window.utools.copyText(result.value)
          } else if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(result.value).catch(function () {})
          }
          status.textContent = '已复制到剪贴板'
        })

        clearBtn.addEventListener('click', function () {
          result.value = ''
          status.textContent = '点击"框选截图识别"选择屏幕区域'
        })

        // 识别进入的命令（uTools 兼容 API）：每次进入都直接触发截图
        if (typeof window.utools?.onPluginEnter === 'function') {
          window.utools.onPluginEnter(function (info) {
            const code = info && info.code ? info.code : 'screen-ocr'
            if (code === 'screen-ocr-translate') {
              applyMode('translate')
              status.textContent = '截图识别后将自动跳转到聚合翻译'
            } else if (code === 'screen-ocr-float') {
              applyMode('float')
              status.textContent = '框选截图后悬浮显示，可选择识别或翻译'
            } else {
              applyMode('recognize')
              status.textContent = '正在截图…'
            }
            // 每次进入都直接开始框选截图
            setTimeout(doCapture, 60)
          })
        } else {
          // 无 onPluginEnter 兼容层时，页面加载后自动开始一次
          setTimeout(doCapture, 300)
        }
      })()
    </script>
  </body>
</html>
