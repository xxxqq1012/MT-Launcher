<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>截图识别</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
        background: #f6f8fa;
        color: #1f2328;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }
      .header img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
      .header .title {
        font-size: 15px;
        font-weight: 600;
      }
      .header .badge {
        font-size: 11px;
        color: #15803d;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 20px;
        padding: 2px 8px;
      }
      .actions {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d1d5db;
        background: #fff;
        color: #1f2328;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .btn:hover {
        background: #f3f4f6;
      }
      .btn.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .btn.primary:hover {
        background: #1d4ed8;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .btn:disabled:hover {
        background: #fff;
      }
      .btn.primary:disabled:hover {
        background: #2563eb;
      }
      .status {
        padding: 0 16px 8px;
        font-size: 12px;
        color: #6b7280;
      }
      .result-wrap {
        flex: 1;
        padding: 0 16px 16px;
        display: flex;
        flex-direction: column;
      }
      textarea {
        flex: 1;
        width: 100%;
        min-height: 220px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        line-height: 1.7;
        resize: none;
        background: #fff;
        font-family: inherit;
      }
      textarea:focus {
        outline: 2px solid #93c5fd;
        border-color: #3b82f6;
      }
      .empty {
        color: #9ca3af;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 13px;
      }
      .tip {
        font-size: 12px;
        color: #9ca3af;
        padding: 0 16px 14px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icon.png" alt="MT" />
      <span class="title">截图识别</span>
      <span class="badge">本地离线 · PaddleOCR</span>
    </div>
    <div class="actions">
      <button id="captureBtn" class="btn primary">框选截图识别</button>
      <button id="copyBtn" class="btn">复制结果</button>
      <button id="clearBtn" class="btn">清空</button>
    </div>
    <div class="status" id="status">点击"框选截图识别"选择屏幕区域</div>
    <div class="result-wrap">
      <textarea id="result" placeholder="识别结果将显示在这里"></textarea>
    </div>
    <div class="tip">识别在本地完成，图片不会上传到任何服务器。支持中文、英文与常用符号。</div>

    <script>
      ;(function () {
        const captureBtn = document.getElementById('captureBtn')
        const copyBtn = document.getElementById('copyBtn')
        const clearBtn = document.getElementById('clearBtn')
        const result = document.getElementById('result')
        const status = document.getElementById('status')

        function setBusy(busy, msg) {
          captureBtn.disabled = busy
          if (msg) status.textContent = msg
        }

        async function doCapture() {
          setBusy(true, '正在框选屏幕区域…')
          let image = ''
          try {
            image = await new Promise(function (resolve) {
              if (typeof window.ztools?.screenCapture === 'function') {
                window.ztools.screenCapture(function (img) {
                  resolve(img)
                })
              } else {
                resolve('')
              }
            })
          } catch (e) {
            console.error('[ScreenOcr] 截图失败:', e)
            image = ''
          }
          if (!image) {
            setBusy(false, '已取消截图，或当前环境不支持截图')
            return
          }
          setBusy(true, '正在识别文字…')
          status.textContent = '正在识别文字…'
          try {
            const res = await window.ztools.ocrRecognize(image)
            if (res && res.success) {
              result.value = res.text || ''
              status.textContent = res.text ? '识别完成' : '未在所选区域识别到文字'
            } else {
              status.textContent = '识别失败: ' + (res?.error || '未知错误')
            }
          } catch (e) {
            console.error('[ScreenOcr] 识别调用失败:', e)
            status.textContent = '识别调用失败: ' + (e && e.message ? e.message : '未知错误')
          }
          setBusy(false)
        }

        captureBtn.addEventListener('click', doCapture)

        copyBtn.addEventListener('click', function () {
          if (!result.value) return
          if (typeof window.utools?.copyText === 'function') {
            window.utools.copyText(result.value)
          } else if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(result.value).catch(function () {})
          }
          status.textContent = '已复制到剪贴板'
        })

        clearBtn.addEventListener('click', function () {
          result.value = ''
          status.textContent = '点击"框选截图识别"选择屏幕区域'
        })

        // 页面加载后自动开始一次截图识别
        setTimeout(doCapture, 300)
      })()
    </script>
  </body>
</html>
